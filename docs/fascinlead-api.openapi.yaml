openapi: 3.1.0
info:
  title: FascinLead CRM Integration API
  version: 1.0.0
  description: |
    API servidor-a-servidor, somente leitura, para sincronizacao incremental de
    leads com sistemas de CRM. A implementacao atual e um middleware do servidor
    Vite e ainda nao representa uma API publicada em producao.
servers:
  - url: http://127.0.0.1:5173/api/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      security: []
      summary: Verifica se o processo local da API esta ativo
      responses:
        '200':
          description: Processo ativo
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { ok: true, service: fascinlead-api, version: v1 }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
  /leads:
    get:
      operationId: listLeads
      summary: Lista leads em ordem crescente de atualizacao
      description: |
        Retorna no maximo 100 registros. Sem `store_id`, consulta todas as lojas
        liberadas para o token. O cursor e opaco e deve ser reutilizado sem alteracao.
      parameters:
        - in: query
          name: updated_since
          schema: { type: string, format: date-time }
          description: Retorna somente registros alterados depois deste instante.
        - in: query
          name: store_id
          schema:
            type: array
            items: { $ref: '#/components/schemas/StoreId' }
          style: form
          explode: true
          description: Pode ser repetido ou conter valores separados por virgula.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
          description: Cursor opaco retornado pela pagina anterior.
        - in: query
          name: include_sensitive
          schema: { type: boolean, default: false }
          description: So produz efeito quando `FASCINLEAD_API_SENSITIVE_FIELDS=true` no servidor.
      responses:
        '200':
          description: Pagina de leads
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Lead' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/StoreForbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfigured' }
  /leads/{leadId}:
    get:
      operationId: getLead
      summary: Consulta um lead pelo identificador
      description: Leads fora das lojas liberadas sao respondidos como nao encontrados.
      parameters:
        - in: path
          name: leadId
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9-]{1,128}$' }
        - in: query
          name: include_sensitive
          schema: { type: boolean, default: false }
          description: So produz efeito quando `FASCINLEAD_API_SENSITIVE_FIELDS=true` no servidor.
      responses:
        '200':
          description: Lead encontrado
          headers:
            X-Request-Id: { $ref: '#/components/headers/RequestId' }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Lead' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/LeadNotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/NotConfigured' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: integration-token
      description: Token aleatorio com no minimo 32 caracteres, mantido apenas no servidor.
  headers:
    RequestId:
      description: UUID para correlacionar a requisicao com registros tecnicos.
      schema: { type: string, format: uuid }
  responses:
    InvalidRequest:
      description: Parametro, data, loja, limite ou cursor invalido
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Bearer Token ausente ou invalido
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    StoreForbidden:
      description: O token nao permite uma das lojas solicitadas
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    LeadNotFound:
      description: Lead inexistente ou fora das lojas permitidas
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    MethodNotAllowed:
      description: Metodo HTTP nao permitido
      headers:
        Allow:
          schema: { type: string, const: GET }
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalError:
      description: Falha interna sem exposicao de dados sensiveis
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotConfigured:
      description: Token ou configuracao do servidor ausente
      headers:
        X-Request-Id: { $ref: '#/components/headers/RequestId' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    Health:
      type: object
      required: [ok, service, version]
      properties:
        ok: { type: boolean, const: true }
        service: { type: string, const: fascinlead-api }
        version: { type: string, const: v1 }
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [invalid_request, unauthorized, store_forbidden, lead_not_found, route_not_found, method_not_allowed, internal_error, api_not_configured]
            message: { type: string }
        requestId: { type: string, format: uuid }
    StoreId:
      type: string
      enum: [loja-02, loja-04, loja-05, loja-06]
    Pagination:
      type: object
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Lead:
      type: object
      required: [id, fullName, preferredName, phone, storeId, interest, capturedAt, capturedBy, source, appointment, followUp, notes, createdAt, updatedAt, schemaVersion]
      properties:
        id: { type: string }
        fullName: { type: string }
        preferredName: { type: string }
        phone: { type: string }
        customerCpf:
          type: string
          description: Presente apenas quando campos sensiveis estao habilitados e solicitados.
        customerRg:
          type: string
          description: Presente apenas quando campos sensiveis estao habilitados e solicitados.
        birthDate:
          type: string
          format: date
          description: Presente apenas quando campos sensiveis estao habilitados e solicitados.
        sex:
          type: string
          enum: [female, male, '']
          description: Presente apenas quando campos sensiveis estao habilitados e solicitados.
        storeId: { $ref: '#/components/schemas/StoreId' }
        street: { type: string }
        streetNumber: { type: string, description: Numero do endereco ou S/N. }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        interest:
          type: object
          required: [id, label]
          properties:
            id: { type: string }
            label: { type: string }
        capturedAt: { type: string, format: date-time }
        capturedBy:
          type: object
          required: [uid, name]
          properties:
            uid: { type: string }
            name: { type: string }
        source: { type: string }
        appointment:
          type: [object, 'null']
          properties:
            date: { type: string, format: date }
            time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
            attendance: { type: string, enum: [pending, attended, missed] }
            durationMinutes: { type: [integer, 'null'] }
        followUp:
          type: object
          required: [contactedAt, contactedByName]
          properties:
            contactedAt: { type: string }
            contactedByName: { type: string }
        notes: { type: string }
        health:
          type: object
          description: Presente apenas quando campos sensiveis estao habilitados e solicitados.
          required: [ametropias, conditions]
          properties:
            ametropias: { type: array, items: { type: string } }
            conditions: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        schemaVersion: { type: integer }
